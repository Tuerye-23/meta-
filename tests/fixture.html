<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>映间接口模拟测试</title><link rel="stylesheet" href="../style.css">
<style>body{margin:0;background:#1c2229;color:#eee;font-family:system-ui;--SmartThemeBlurTintColor:#252d37;--SmartThemeBodyColor:#e6ebef;}#extensions_settings2{padding:25px}button{cursor:pointer}</style>
<body><div id="extensions_settings2">这里模拟酒馆的扩展设置。</div><div id="extensionsMenu"></div><script>
const events=new Map();window.mockRequests=[];window.mockDelay=0;window.failOnce=false;
const context={name1:'测试用户',name2:'双人测试卡',characterId:0,chatId:'测试主线',characters:[{name:'双人测试卡',avatar:'test.png',description:'Alpha：冷淡直接。Beta：活泼。测试用户和两人是朋友。',data:{extensions:{world:'测试世界'}}}],chat:Array.from({length:20},(_,i)=>({name:i%2?'Alpha':'测试用户',is_user:i%2===0,mes:'主线第'+(i+1)+'条，测试内容。'})),accountStorage:localStorage,powerUserSettings:{persona_description:'测试用户，喜欢创作。'},maxContext:100000,
  getTokenCountAsync:async s=>s.length,unshallowCharacter:async()=>{},getWorldInfoNames:()=>['测试世界'],loadWorldInfo:async()=>({entries:{0:{comment:'背景',content:'城市背景，Alpha和Beta是朋友。'}}}),
  getRegexScripts:()=>[{id:'body',scriptName:'正文提取',findRegex:'/<正文>([\\s\\S]*?)<\\/正文>/g',placement:[2],disabled:false}],
  worldInfo:{charLore:[]},eventTypes:{APP_READY:'ready',APP_INITIALIZED:'init',EXTENSIONS_FIRST_LOAD:'first',GENERATION_STARTED:'start',GENERATION_ENDED:'end',GENERATION_STOPPED:'stop',CHAT_CHANGED:'change',MESSAGE_RECEIVED:'received',MESSAGE_EDITED:'edited',MESSAGE_SWIPED:'swiped',WORLDINFO_UPDATED:'world-update'},eventSource:{on:(k,f)=>{if(!events.has(k))events.set(k,[]);events.get(k).push(f)},removeListener:(k,f)=>events.set(k,(events.get(k)||[]).filter(x=>x!==f))},
  generateRaw:async request=>{window.mockRequests.push(request);if(window.mockDelay)await new Promise(r=>setTimeout(r,window.mockDelay));if(window.failOnce){window.failOnce=false;throw Error('模拟网络失败')}if(request.systemPrompt.includes('人物设定整理器'))return JSON.stringify([{name:'Alpha',personality:'冷淡直接',relationship:'朋友',speech:'短句'},{name:'Beta',personality:'活泼',relationship:'朋友'}]);if(request.systemPrompt.startsWith('整理这两人'))return'测试摘要：我们聊过写作。';const who=request.systemPrompt.includes('你正在扮演 Alpha')?'Alpha':'Beta';return who+'：收到，这是独立 meta 回复。';}
};window.SillyTavern={getContext:()=>context};window.mockContext=context;window.mockEmit=(name)=>{for(const f of events.get(context.eventTypes[name])||[])f();};
window.STBaiBaiBook={apiVersion:1,pluginVersion:'1.2.9',getHistory:({before})=>({text:'摘要截至第'+before+'条',coverage:{complete:true}}),getSnapshot:({floor})=>({state:{time:'第'+(floor+1)+'条时间'},protagonist:{identity:'测试用户'},npcs:[{name:'Alpha'}],coverage:{complete:true}}),getFloor:i=>({body:context.chat[i].mes,omitted:false})};
const qrSets=JSON.parse(localStorage.getItem('mock-qr-sets')||'{}');window.qrCalls=[];
window.quickReplyApi={getSetByName:name=>qrSets[name],getQrByLabel:(name,label)=>qrSets[name]?.find(q=>q.label===label),createSet:async name=>{qrSets[name]=[];window.qrCalls.push('set');localStorage.setItem('mock-qr-sets',JSON.stringify(qrSets));},createQuickReply:(name,label,props)=>{qrSets[name].push({label,...props});window.qrCalls.push(props.message);localStorage.setItem('mock-qr-sets',JSON.stringify(qrSets));},addGlobalSet:()=>window.qrCalls.push('enable')};
</script><script type="module" src="../index.js"></script></body></html>
