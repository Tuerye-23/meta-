<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>映间接口模拟测试</title><link rel="stylesheet" href="../style.css">

<body><div id="extensions_settings2">这里模拟酒馆的扩展设置。</div><div id="extensionsMenu"></div><script>

const context={name1:'测试用户',name2:'双人测试卡',characterId:0,groupId:'group-test',groups:[{id:'group-test',members:['alpha.png','beta.png']}],chatId:'测试主线',characters:[{name:'Alpha',avatar:'alpha.png',description:'Alpha：冷淡直接。测试用户和Alpha是朋友。',data:{extensions:{world:'测试世界'}}},{name:'Beta',avatar:'beta.png',description:'Beta：活泼。测试用户和Beta是朋友。',data:{extensions:{world:'测试世界'}}}],chat:Array.from({length:20},(_,i)=>({name:i%2?'Alpha':'测试用户',is_user:i%2===0,mes:'主线第'+(i+1)+'条，测试内容。'})),accountStorage:localStorage,powerUserSettings:{persona_description:'测试用户，喜欢创作。'},maxContext:100000,
  getTokenCountAsync:async s=>s.length,getRequestHeaders:()=>({'Content-Type':'application/json'}),unshallowCharacter:async()=>{},getWorldInfoNames:()=>['测试世界'],loadWorldInfo:async()=>({entries:{0:{uid:0,position:0,comment:'背景',content:'城市背景，Alpha和Beta是朋友。'},1:{uid:1,position:1,comment:'多人设定',content:'Gamma：谨慎的医生，喜欢喝茶。Delta：开朗的记者，随身带着旧相机。两人住在同一座城市。'},2:{uid:2,position:1,comment:'后置设定',content:'雨季，公共交通停止。'},3:{uid:3,position:1,comment:'隐藏人设',disable:true,content:'Morty Smith：谨慎而认真。Rick Sanchez：直接的科学家。'}}}),
  getRegexScripts:()=>[{id:'body',scriptName:'正文提取',findRegex:'/<正文>([\\s\\S]*?)<\\/正文>/g',placement:[2],disabled:false}],
  worldInfo:{charLore:[]},eventTypes:{APP_READY:'ready',APP_INITIALIZED:'init',EXTENSIONS_FIRST_LOAD:'first',GENERATION_STARTED:'start',GENERATION_ENDED:'end',GENERATION_STOPPED:'stop',CHAT_CHANGED:'change',MESSAGE_RECEIVED:'received',MESSAGE_EDITED:'edited',MESSAGE_SWIPED:'swiped',WORLDINFO_UPDATED:'world-update'},eventSource:{on:(k,f)=>{if(!events.has(k))events.set(k,[]);events.get(k).push(f)},removeListener:(k,f)=>events.set(k,(events.get(k)||[]).filter(x=>x!==f))},
  generateRaw:async request=>{window.mockRequests.push(request);if(window.mockDelay)await new Promise(r=>setTimeout(r,window.mockDelay));if(window.failOnce){window.failOnce=false;throw Error('模拟网络失败')}if(request.prompt.some(m=>m.content.startsWith('识别以下素材')))return request.prompt.at(-1).content.includes('隐藏人设')?'Morty Smith\nRick Sanchez':'Gamma\nDelta';if(request.prompt.some(m=>m.content.includes('从提供的角色卡或世界书条目中'))){if(request.prompt.at(-1).content.startsWith('所选角色：\nMorty Smith\n'))return '### **【morty smith】**\r\n【性格】\r\n谨慎而认真。\r\n【背景】\r\n与Rick一起冒险。';return '【Gamma】\nGamma：谨慎的医生，喜欢喝茶。两人住在同一座城市。\n\n【Delta】\nDelta：开朗的记者，随身带着旧相机。两人住在同一座城市。';}if(request.systemPrompt.startsWith('整理这两人'))return'测试摘要：我们聊过写作。';const who=request.prompt.some(m=>m.content.includes('当前聊天角色：Alpha'))?'Alpha':'Beta';return who+'：收到，这是独立 meta 回复。';}
};window.SillyTavern={getContext:()=>context};window.mockContext=context;window.mockEmit=(name)=>{for(const f of events.get(context.eventTypes[name])||[])f();};
window.STBaiBaiBook={apiVersion:1,pluginVersion:'1.2.9',getHistory:({before})=>({text:'摘要截至第'+before+'条',coverage:{complete:true}}),getSnapshot:({floor})=>({state:{time:'第'+(floor+1)+'条时间'},protagonist:{identity:'测试用户'},npcs:[{name:'Alpha'}],coverage:{complete:true}}),getFloor:i=>({body:context.chat[i].mes,omitted:false})};
const qrSets=JSON.parse(localStorage.getItem('mock-qr-sets')||'{}');window.qrCalls=[];window.qrSaves=0;
const qrSettings={isEnabled:JSON.parse(localStorage.getItem('mock-qr-enabled')||'false'),config:{setList:[]},save:()=>{localStorage.setItem('mock-qr-enabled',JSON.stringify(qrSettings.isEnabled));localStorage.setItem('mock-qr-active',JSON.stringify(qrSettings.config.setList.map(link=>({name:link.set.name,isVisible:link.isVisible}))));}};
const qrSet=name=>{const set=qrSets[name];if(!set)return;Object.defineProperty(set,'name',{value:name,configurable:true});set.save=async()=>{window.qrSaves++;localStorage.setItem('mock-qr-sets',JSON.stringify(qrSets));};return set;};
qrSettings.config.setList=JSON.parse(localStorage.getItem('mock-qr-active')||'[]').map(link=>({set:qrSet(link.name),isVisible:link.isVisible}));
window.quickReplyApi={settings:qrSettings,getSetByName:qrSet,getQrByLabel:(name,label)=>qrSets[name]?.find(q=>q.label===label),createSet:async name=>{qrSets[name]=[];window.qrCalls.push('set');await qrSet(name).save();},createQuickReply:(name,label,props)=>{qrSets[name].push({label,...props});window.qrCalls.push(props.message);},addGlobalSet:name=>{window.qrCalls.push('enable');if(!qrSettings.config.setList.some(link=>link.set===qrSet(name)))qrSettings.config.setList.push({set:qrSet(name),isVisible:true});qrSettings.save();}};
